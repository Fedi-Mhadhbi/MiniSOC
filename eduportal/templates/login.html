
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - EduPortal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <nav>
        <h1>EduPortal</h1>

        <div>
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </div>
    </nav>
</header>


<main>

    <div class="form-container">

        <h2>Student Login</h2>

        <p>
            Sign in to access your EduPortal account.
        </p>

        <form method="POST" action="/login">

            <div>
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>


<div> <label for="password">Password</label> <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required > {% if login_error %} <p style="color: red; margin-top: 5px;"> {{ login_error }} </p> {% endif %} </div>



            <button type="submit">
                Login
            </button>

        </form>

        <p style="margin-top: 20px; margin-bottom: 0;">
            Don't have an account?
            <a href="/register">Create one</a>
        </p>

    </div>

</main>


<footer>
    <p>&copy; 2026 EduPortal</p>
</footer>

</body>
</html>
