<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MiniSOC{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0d18;
            --bg-raised: #10142200;
            --card: #131728;
            --card-border: #22263a;
            --text: #e6e9f5;
            --text-dim: #8086a3;
            --accent-1: #818cf8;
            --accent-2: #38bdf8;
            --high: #fb7185;
            --medium: #fbbf24;
            --low: #34d399;
        }

        body {
            margin: 0;
            font-family: "Sora", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.12), transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.10), transparent 35%),
                var(--bg);
            color: var(--text);
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* ---------- Sidebar ---------- */

        .sidebar {
            width: 220px;
            background: rgba(10, 13, 24, 0.6);
            padding: 24px 14px;
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 6px 32px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .sidebar .brand .mark {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
        }

        .sidebar a.active {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.22), rgba(56, 189, 248, 0.14));
            color: #ffffff;
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.35);
        }

        .sidebar .logout-link {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
        }

        /* ---------- Main / topbar ---------- */

        .content {
            flex: 1;
            padding: 22px 30px 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 26px;
        }

        .topbar .page-title h1 {
            font-size: 21px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.1px;
        }

        .topbar .page-title .sub {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Renamed from .search-box -> .topbar-search to avoid colliding
           with admin_investigation.html's own .search-box class. */
        .topbar-search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 9px 14px;
            width: 240px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .topbar-search input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            width: 100%;
        }

        .topbar-search input::placeholder {
            color: var(--text-dim);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: var(--text-dim);
            position: relative;
        }

        .icon-btn .dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--high);
            box-shadow: 0 0 0 2px var(--card);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #0a0d18;
        }

        /* ---------- Shared card / table styles (available to all pages) ---------- */

        .card,
        .section,
        .chart-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--card-border);
            text-align: left;
            font-size: 13px;
        }

        th {
            color: var(--text-dim);
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
        }

        .mono {
            font-family: "JetBrains Mono", "Courier New", monospace;
            font-size: 12px;
            color: #c7cbe0;
        }

        .high { color: var(--high); font-weight: 600; }
        .medium { color: var(--medium); font-weight: 600; }
        .low { color: var(--low); font-weight: 600; }

        .status-open { color: var(--high); font-weight: 600; }
        .status-closed { color: var(--low); font-weight: 600; }
    </style>

    {% block styles %}{% endblock %}
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <span class="mark">🛡️</span>
            MiniSOC
        </div>

        <nav>
            <a href="{{ url_for('minisoc_dashboard') }}"
               class="{{ 'active' if request.endpoint == 'minisoc_dashboard' else '' }}">
                📊 Dashboard
            </a>

            <a href="{{ url_for('minisoc_alerts') }}"
               class="{{ 'active' if request.endpoint == 'minisoc_alerts' else '' }}">
                🚨 Alerts
            </a>

            <a href="{{ url_for('minisoc_incidents') }}"
               class="{{ 'active' if request.endpoint == 'minisoc_incidents' else '' }}">
                🧩 Incidents
            </a>

            <a href="{{ url_for('minisoc_events') }}"
               class="{{ 'active' if request.endpoint == 'minisoc_events' else '' }}">
                📜 Events
            </a>

            <a href="{{ url_for('minisoc_investigation') }}"
               class="{{ 'active' if request.endpoint == 'minisoc_investigation' else '' }}">
                🔎 Investigation
            </a>
        </nav>

        <a href="{{ url_for('logout') }}" class="logout-link">
            🚪 Logout
        </a>

    </aside>

    <main class="content">

        <div class="topbar">
            <div class="page-title">
                <h1>{% block header %}Security Operations Center{% endblock %}</h1>
                <div class="sub">MiniSOC &middot; EduPortal environment</div>
            </div>

            <div class="topbar-right">
                <div class="topbar-search">
                    🔍
                    <input type="text" placeholder="Search IP, rule, alert…">
                </div>

                <a href="{{ url_for('minisoc_alerts') }}" class="icon-btn" style="text-decoration:none;">
                    🔔
                    <span class="dot"></span>
                </a>

                <div class="avatar">SA</div>
            </div>
        </div>

        {% block content %}{% endblock %}

    </main>

</div>

</body>
</html>
