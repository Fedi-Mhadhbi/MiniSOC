{% extends "admin_base.html" %}

{% block title %}
MiniSOC - Events
{% endblock %}

{% block header %}
Security Events
{% endblock %}

{% block styles %}

<style>

.section {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    border: 1px solid #334155;
}

.log-container {
    background: #020617;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 15px;
    max-height: 650px;
    overflow-y: auto;
}

.log-line {
    padding: 8px 10px;
    border-bottom: 1px solid #1e293b;
    font-family: monospace;
    font-size: 13px;
    color: #cbd5e1;
    word-break: break-word;
}

.log-line:hover {
    background: #1e293b;
}

</style>

{% endblock %}


{% block content %}

<div class="section">

    <h2>Security Log</h2>

    <div class="log-container">

        {% for event in events %}

        <div class="log-line">
            {{ event }}
        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
