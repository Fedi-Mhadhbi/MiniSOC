<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#131728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- subtle grid lines -->
  <g stroke="#1e2438" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- faint activity sparkline, echoing the dashboard chart -->
  <polyline points="60,230 140,235 220,215 300,225 380,150 460,200 540,120 620,190 700,160 780,210 860,140 940,200 1020,170 1100,205 1140,185"
            fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.55"/>

  <!-- shield icon -->
  <g transform="translate(90,95)">
    <path d="M55 0 L105 20 V65 C105 100 80 125 55 135 C30 125 5 100 5 65 V20 Z"
          fill="url(#accent)" opacity="0.18"/>
    <path d="M55 0 L105 20 V65 C105 100 80 125 55 135 C30 125 5 100 5 65 V20 Z"
          fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M35 65 L48 80 L78 45" fill="none" stroke="#e6e9f5" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="235" y="155" font-family="Arial, Helvetica, sans-serif" font-size="64"
        font-weight="800" fill="#e6e9f5" letter-spacing="1">
    Mini<tspan fill="#818cf8">SOC</tspan>
  </text>

  <!-- subtitle -->
  <text x="238" y="195" font-family="Arial, Helvetica, sans-serif" font-size="20"
        font-weight="500" fill="#8086a3" letter-spacing="0.5">
    Real-Time Attack Detection &amp; Correlation Engine
  </text>

  <!-- small tag pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    <rect x="238" y="212" width="104" height="26" rx="13" fill="#fb7185"/>
    <text x="252" y="229" fill="#0a0d18">BLUE TEAM</text>

    <rect x="352" y="212" width="90" height="26" rx="13" fill="#38bdf8"/>
    <text x="366" y="229" fill="#0a0d18">PYTHON</text>

    <rect x="452" y="212" width="78" height="26" rx="13" fill="#34d399"/>
    <text x="466" y="229" fill="#0a0d18">FLASK</text>
  </g>
</svg>
